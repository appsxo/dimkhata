name: Nightly Supabase Keep-Alive

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase KV Store
        run: |
          SB_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY:-$VITE_SUPABASE_ANON_KEY}"
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$SB_KEY" ]; then
            curl -s -f -H "apikey: $SB_KEY" \
              "$VITE_SUPABASE_URL/rest/v1/dimkhata_kv_store?select=key&limit=1" > /dev/null || true
          fi
